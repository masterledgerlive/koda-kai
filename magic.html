<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Drop — Kodakai</title>
<style>
  :root{--sea:#0a2233;--sea2:#0e3049;--gold:#ffd166;--ink:#eaf6ff;--dim:#9db8c9;--drop:#4cc9f0;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh;
    background:radial-gradient(1000px 700px at 50% -10%,#1a1440,#0a0a23);}
  .stars{position:fixed;inset:0;pointer-events:none;}
  .tw{position:absolute;color:#fff;animation:tw 3s ease-in-out infinite;}
  @keyframes tw{50%{opacity:.2;}}
  header{text-align:center;padding:24px 14px 2px;position:relative;}
  header h1{margin:0;font-size:30px;}
  header p{color:var(--dim);font-size:14px;margin:6px 0 0;}
  #app{max-width:560px;margin:0 auto;padding:14px;position:relative;text-align:center;}
  #dropWrap{position:relative;display:inline-block;margin-top:6px;}
  #drop{width:240px;max-width:60vw;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 14px 30px rgba(76,201,240,.35));}
  @keyframes float{50%{transform:translateY(-12px);}}
  #drop.shake{animation:shk .65s linear;}
  @keyframes shk{0%,100%{transform:rotate(0);}15%{transform:rotate(-14deg) translateY(-8px);}
    30%{transform:rotate(12deg);}45%{transform:rotate(-10deg) translateY(-6px);}
    60%{transform:rotate(8deg);}75%{transform:rotate(-6deg);}90%{transform:rotate(3deg);}}
  #dropWrap .spark{position:absolute;font-size:24px;animation:spk 1s ease forwards;pointer-events:none;}
  @keyframes spk{to{transform:translateY(-60px) scale(.3);opacity:0;}}
  #bubble{margin:18px auto 0;max-width:480px;min-height:110px;background:#101a3a;border:2px solid #2a3a6e;
    border-radius:18px;padding:18px 20px;font-size:20px;line-height:1.6;text-align:left;position:relative;}
  #bubble::before{content:"";position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    border:14px solid transparent;border-bottom-color:#2a3a6e;border-top:0;}
  #answer{min-height:64px;}
  #cursor{display:inline-block;width:3px;height:1.1em;background:var(--gold);vertical-align:-2px;animation:blink .7s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  #askRow{display:flex;gap:8px;margin-top:14px;}
  #q{flex:1;background:#0b1026;border:1px solid #2a3a6e;color:var(--ink);border-radius:12px;
    padding:14px;font-size:16px;font-family:inherit;}
  #shakeBtn{border:none;border-radius:12px;padding:14px 26px;font-size:18px;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,var(--gold),#ff9a3d);color:#3a2400;}
  #shakeBtn:active{transform:scale(.95);}
  #count{color:var(--dim);font-size:13px;margin-top:12px;}
  footer{text-align:center;color:var(--dim);font-size:12px;padding:20px;position:relative;}
  footer a{color:var(--drop);}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<header>
  <h1>🔮 Magic Drop</h1>
  <p>Ask a question. Shake the Drop. Watch him type your fortune.</p>
</header>
<div id="app">
  <div id="dropWrap">
    <img id="drop" src="assets/char/drop-toy3d.webp" alt="Magic Drop">
  </div>
  <div id="bubble"><div id="answer">Psst… ask me anything.</div></div>
  <div id="askRow">
    <input id="q" placeholder="Will I have fun today?" maxlength="80">
    <button id="shakeBtn">Shake!</button>
  </div>
  <div id="count"></div>
</div>
<footer><a href="bedtime.html">← bedtime stories</a> · <a href="index.html">Koda Kai</a></footer>
<script>
const $=id=>document.getElementById(id);
(()=>{ const s=$('stars'); for(let i=0;i<60;i++){ const d=document.createElement('div');
  d.className='tw'; d.textContent='·'; d.style.left=Math.random()*100+'%'; d.style.top=Math.random()*55+'%';
  d.style.fontSize=(6+Math.random()*12)+'px'; d.style.animationDelay=(Math.random()*3)+'s'; s.appendChild(d); } })();
const ANSWERS=[
 "Yes — and it's going to be FUN.",
 "The waves say yes. Trust the waves.",
 "All signs point to snack time first, then yes.",
 "Drop believes in you. That's a yes.",
 "Hmm… ask again after you do a silly dance.",
 "The moon thought about it and said: absolutely.",
 "Yes! But only if you bring a friend.",
 "The tide is coming in, and it's bringing good news.",
 "Maybe — the water's a little cloudy on this one. Try again!",
 "Nope! …Just kidding. YES.",
 "The stars twinkled twice. That's a yes in star language.",
 "Ask your heart — it already knows. (It's yes.)",
 "Definitely, but first: drink some water. Hydration is magic.",
 "The 8-ball says yes. The Drop says YESSS.",
 "Not today — tomorrow's tides look better.",
 "Yes, yes, a thousand times yes.",
 "The answer is floating up… up… YES!",
 "Only on days ending in 'y'. So… yes.",
 "Shake me again — I want to say it twice: YES!",
 "The universe whispered it: yes."
];
let n=0, typing=false;
try{ n=parseInt(localStorage.getItem('kk_magic_n')||'0'); }catch(e){}
function renderCount(){ $('count').textContent=n?('🔮 Drop has answered '+n+' question'+(n===1?'':'s')):''; }
renderCount();
let AC=null;
function chime(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  [660,880,1320].forEach((f,i)=>{ const o=AC.createOscillator(),g=AC.createGain();
    o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.12,AC.currentTime+i*.09);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+i*.09+.4);
    o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+i*.09); o.stop(AC.currentTime+i*.09+.45); });
 }catch(e){} }
function sparkles(){ const w=$('dropWrap');
  for(let i=0;i<10;i++){ const s=document.createElement('div'); s.className='spark'; s.textContent='✨';
    s.style.left=(10+Math.random()*80)+'%'; s.style.top=(20+Math.random()*50)+'%'; w.appendChild(s);
    setTimeout(()=>s.remove(),1100); } }
function typeAnswer(text){ typing=true;
  const box=$('answer'); box.innerHTML='<span id="cursor"></span>'; const cur=$('cursor');
  let i=0;
  (function tick(){ if(i<text.length){ cur.insertAdjacentText('beforebegin',text[i++]);
      setTimeout(tick,18+Math.random()*38); }
    else { setTimeout(()=>cur.remove(),1200); typing=false; } })();
}
function ask(){ if(typing) return;
  const q=$('q').value.trim();
  const drop=$('drop'); drop.classList.remove('shake'); void drop.offsetWidth; drop.classList.add('shake');
  sparkles(); chime();
  $('answer').textContent='…';
  setTimeout(()=>{ const a=ANSWERS[Math.random()*ANSWERS.length|0];
    typeAnswer((q?'“'+q+'” … ':'')+a);
    n++; try{ localStorage.setItem('kk_magic_n',n); }catch(e){} renderCount();
  },700);
}
$('shakeBtn').addEventListener('click',ask);
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter') ask(); });
</script>
</body>
</html>
